name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Download EfficientNet-Lite0 classifier model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 -o app/src/main/assets/classifier.tflite \
            "https://storage.googleapis.com/mediapipe-models/image_classifier/efficientnet_lite0/float32/1/efficientnet_lite0.tflite" \
            || echo "WARNING: Model download failed. App will run without TFLite classifier."
          ls -la app/src/main/assets/ || true

      - name: Download CLIP ONNX models + tokenizer
        run: |
          mkdir -p app/src/main/assets
          # Image encoder (quantized, ~25MB)
          curl -L --fail --retry 3 -o app/src/main/assets/clip_image.onnx \
            "https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/onnx/vision_model_quantized.onnx" \
            || echo "WARNING: CLIP image encoder download failed."
          # Text encoder (quantized, ~30MB)
          curl -L --fail --retry 3 -o app/src/main/assets/clip_text.onnx \
            "https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/onnx/text_model_quantized.onnx" \
            || echo "WARNING: CLIP text encoder download failed."
          # BPE tokenizer files (~1.5MB)
          curl -L --fail --retry 3 -o app/src/main/assets/clip_vocab.json \
            "https://huggingface.co/openai/clip-vit-base-patch32/resolve/main/vocab.json" \
            || echo "WARNING: CLIP vocab download failed."
          curl -L --fail --retry 3 -o app/src/main/assets/clip_merges.txt \
            "https://huggingface.co/openai/clip-vit-base-patch32/resolve/main/merges.txt" \
            || echo "WARNING: CLIP merges download failed."
          ls -la app/src/main/assets/ || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenshotCleaner-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create/update "latest" release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Auto-built APK from the most recent push to main.
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
